<svg width="760" height="230" viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,Consolas,monospace;}
      .dim{fill:#a89984;}
      .aqua{fill:#8ec07c;}
      .orange{fill:#fe8019; font-weight:700;}
      .fg{fill:#ebdbb2;}
      .cursor{fill:#8ec07c; animation:blink 1s steps(1,end) infinite;}
      @keyframes blink{50%{opacity:0;}}
      .fadein{opacity:0; animation:fadein 0.6s ease-out forwards;}
      @keyframes fadein{to{opacity:1;}}
    </style>
    <clipPath id="card">
      <rect x="0" y="0" width="760" height="230" rx="10"/>
    </clipPath>
    <clipPath id="revealName">
      <rect x="0" y="0" height="46" width="0">
        <animate attributeName="width" from="0" to="330" dur="1.1s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- fondo -->
    <rect x="0" y="0" width="760" height="230" fill="#282828"/>

    <!-- barra de titulo -->
    <rect x="0" y="0" width="760" height="34" fill="#3c3836"/>
    <circle cx="24" cy="17" r="6" fill="#fb4934"/>
    <circle cx="44" cy="17" r="6" fill="#fabd2f"/>
    <circle cx="64" cy="17" r="6" fill="#8ec07c"/>
    <text x="84" y="22" class="mono dim" font-size="13">alejandro@nezzontli:~</text>

    <!-- prompt whoami -->
    <text x="30" y="72" class="mono aqua" font-size="14">alejandro@nezzontli<tspan fill="#a89984">:~$</tspan><tspan fill="#ebdbb2"> whoami</tspan></text>

    <!-- nombre con efecto de escritura -->
    <g clip-path="url(#revealName)">
      <text x="30" y="115" class="mono orange" font-size="32">Alejandro Bernal</text>
    </g>
    <rect class="cursor" x="30" y="90" width="3" height="28">
      <animate attributeName="x" from="30" to="358" dur="1.1s" begin="0.3s" fill="freeze"/>
    </rect>

    <!-- tagline -->
    <text x="30" y="150" class="mono dim fadein" font-size="14" style="animation-delay:1.6s">
      Estudiante de física — ciencia, software libre y privacidad digital.
    </text>

    <!-- linea de stack -->
    <text x="30" y="185" class="mono fg fadein" font-size="13" style="animation-delay:2.1s">
      <tspan fill="#8ec07c">FreeBSD</tspan><tspan fill="#665c54"> · </tspan><tspan fill="#fabd2f">OpenBSD</tspan><tspan fill="#665c54"> · </tspan><tspan fill="#d3869b">NixOS</tspan><tspan fill="#665c54"> · </tspan><tspan fill="#fe8019">Neovim</tspan><tspan fill="#665c54"> · </tspan><tspan fill="#83a598">got</tspan>
    </text>

    <!-- prompt final parpadeante -->
    <text x="30" y="215" class="mono dim fadein" font-size="13" style="animation-delay:2.5s">alejandro@nezzontli:~$</text>
    <rect class="cursor" x="196" y="203" width="8" height="14" style="animation-delay:2.5s"/>

    <!-- borde -->
    <rect x="0.5" y="0.5" width="759" height="229" rx="10" fill="none" stroke="#504945" stroke-width="1"/>
  </g>
</svg>
