name: refresh-profile-assets

# Regenerates data/contributions.json + contrib-heatmap.svg from the public
# GitHub contribution calendar and commits them back.
#
# NOTE: this commits to the repo. If this repo is a *push* mirror from a
# Forgejo/Gitea instance, the next mirror sync will force-push over these
# commits. For the workflow to stick, GitHub must be authoritative for this
# repo (disable the push mirror, or switch it to a pull mirror).

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh contribution heatmap [skip ci]"
            git push
          fi
